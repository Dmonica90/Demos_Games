name: Test and deploy

# Every pull request runs the tests and the build. A push to main also
# publishes the game at https://dmonica90.github.io/Shield_Defense/. The site
# is built here rather than committed, so the repository keeps only sources.
#
# One-time setup: Settings -> Pages -> Source must be set to "GitHub Actions".
# GitHub Pages on a private repository needs a paid GitHub plan.

on:
  push:
    branches: [main]
  pull_request:
  # Lets you re-publish from the Actions tab without pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one waits rather than being cancelled,
# so the last push to main always wins.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A broken build should never reach the live site. `npm run build` also
      # typechecks, and the unit tests cover the scoring engine and the cases.
      - name: Test
        run: npm test

      # The Supabase URL and anon key are public by design (they ship in the
      # page); they live in repository variables so they are easy to change.
      # Without them the site builds in local mode (same-browser only).
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: app/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
